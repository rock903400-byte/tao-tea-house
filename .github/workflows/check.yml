name: Site Guard

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demo entry must exist
        run: test -f index.html
      - name: No secrets committed
        run: |
          ! git ls-files | grep -v '\.example$' | grep -Ei '\.(pem|key|p12)$|serviceAccount.*\.json$|(^|/)\.env(\.|$)'

